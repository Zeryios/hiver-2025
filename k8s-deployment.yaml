apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-spring-boot
  template:
    metadata:
      labels:
        app: hello-spring-boot
    spec:
      containers:
        - name: hello-spring-boot
          image: zeryios272/hello-spring-boot:v6 # <-- changez ici
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: hello-service
spec:
  type: NodePort
  selector:
    app: hello-spring-boot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080  # Accès via localhost:30080
